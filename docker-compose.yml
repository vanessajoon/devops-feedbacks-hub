version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    container_name: frontend-container
    restart: always

  backend:
    build: ./backend
    ports:
      - "5000:5000"          # Matches your app's port 5000
    container_name: backend-container
    restart: always
    environment:
      - PORT=5000
      - MONGO_URL=mongodb://mongo:27017/feedback-db   # Connects to the database service below
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: mongo-container
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongo_data:/data/db  # Keeps your data saved even if containers stop

volumes:
  mongo_data: